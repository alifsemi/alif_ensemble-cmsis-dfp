# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault: # use CMSIS-Toolbox default Compiler options

  # Compilers that can be selected
  select-compiler:
    - compiler: AC6
    - compiler: GCC
    - compiler: CLANG

  # List the packs that define the device and/or board.
  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.1-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: DevKit-E8
      board: DevKit-E8
      device: AE822FA0E5597LS0
      target-set:
        - set:
          images:
            - project-context: M55_HE.Debug
          debugger:
            name: J-Link Server
            clock: 1000000
            protocol: jtag

  # List of different build configurations.
  build-types:
    - type: Debug
      debug: on
      optimize: none

    - type: Release
      debug: off
      optimize: balanced

  # List related projects.
  projects:
    - project: M55_HE/M55_HE.cproject.yml
